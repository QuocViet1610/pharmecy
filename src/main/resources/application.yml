spring:
  application:
    name: medilink-checkup
  datasource:
    url: jdbc:h2:mem:medilink;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8099

logging:
  level:
    com.medilink.checkup: INFO

# Chỉ mở endpoint health — dùng cho Docker healthcheck.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
